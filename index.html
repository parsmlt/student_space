<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A calm, simple home for your study plans and goals.">
    <title>Study Space — Student Productivity Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <a class="brand" href="#home" aria-label="Study Space home">
          <span class="brand-mark" aria-hidden="true">S</span>
          <span>Study Space</span>
        </a>
        <div class="topbar-actions">
          <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false"><span aria-hidden="true">☾</span><span data-theme-label>Dark mode</span></button>
          <a class="today-label nav-link" href="dashboard.html">OPEN DASHBOARD <span aria-hidden="true">→</span></a>
        </div>
      </header>

      <section class="welcome-card" id="home" aria-labelledby="page-title">
        <p class="eyebrow">A FRESH START</p>
        <h1 id="page-title">Make room for what matters.</h1>
        <p class="intro">A calmer place to plan your studies, keep deadlines in view, and celebrate your progress.</p>
        <a class="button" href="dashboard.html">Set up my study space <span aria-hidden="true">→</span></a>
        <div class="note" id="coming-soon">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Your study dashboard is ready for its first tasks.</span>
        </div>
      </section>

      <footer>Made for focused days and small wins.</footer>
    </main>
  </body>
</html>
